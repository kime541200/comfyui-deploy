x-common-gpu: &comfyui-gpu-mount
  resources:
    reservations:
      devices:
        - driver: nvidia
          capabilities: ["gpu"]
          device_ids: ["0"]

x-comfyui: &comfyui
  shm_size: 8gb
  ports:
    - "${PORT:-8188}:8188"
  volumes:
    - ${COMFYUI_DATA_DIR:-/data/comfyui}/models:/app/ComfyUI/models
    - ${COMFYUI_DATA_DIR:-/data/comfyui}/input:/app/ComfyUI/input
    - ${COMFYUI_DATA_DIR:-/data/comfyui}/output:/app/ComfyUI/output
    - ${COMFYUI_DATA_DIR:-/data/comfyui}/workflows:/app/ComfyUI/user/default/workflows
  command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188"]
  deploy: *comfyui-gpu-mount

# 單一 service，以 PROFILE 環境變數選擇 profiles/<PROFILE>.yaml（預設 default）。
# 同一時間只啟動一個（共用 port 8188 與 GPU）：
#   docker compose up -d --build                      # default（只有 base node）
#   PROFILE=wan-smooth docker compose up -d --build   # 其他 profile
services:
  comfyui:
    <<: *comfyui
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        PROFILE: ${PROFILE:-default}
    image: comfyui:${PROFILE:-default}
    container_name: comfyui
    restart: unless-stopped
